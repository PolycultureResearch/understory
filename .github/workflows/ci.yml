name: ci

on:
  push:
    branches: [main]
  pull_request:

# Minimal on purpose while nothing is in production: lint, and the tests that
# need no warehouse. The DuckDB-backed and MetricFlow-backed tests need the
# fake_companies databases and run locally (`uv run pytest`).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Lint
        run: |
          uv sync --all-extras
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Fast tests
        run: uv run pytest -q -m "not fake_db and not metricflow and not slow"
