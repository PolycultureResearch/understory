name: bristlecone
display_name: "Bristlecone Botanicals"
vertical: cpg_wholesale

warehouse:
  type: duckdb
  path: "${FAKE_COMPANIES_DIR:-/Users/devon/Documents/code/fake_companies}/out/bristlecone.duckdb"
  read_only: true

semantic_layer:
  type: metricflow_local
  dbt_project_dir: "${FAKE_COMPANIES_DIR:-/Users/devon/Documents/code/fake_companies}/dbt/cpg_wholesale"
  mf_bin: mf
  env:
    FAKE_DB: "${FAKE_COMPANIES_DIR:-/Users/devon/Documents/code/fake_companies}/out/bristlecone.duckdb"

limits:
  row_cap: 200
  timeout_s: 60
  max_clarifications: 3

sql:
  enabled: true
  schemas: [main_marts]

log:
  events_prefix: "${UNDERSTORY_LOG_DIR:-.understory-log}/bristlecone/events"
  text_prefix: "${UNDERSTORY_LOG_DIR:-.understory-log}/bristlecone/text"
  text_retention_days: 90

instructions: >
  Understory exposes Bristlecone Botanicals's governed metrics. Call get_context first, then
  query_metrics with a spec. Present clarification options verbatim. Include every
  required_disclosure in your answer. Call log_answer with your draft before replying.
