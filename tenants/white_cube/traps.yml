# White Cube (B2C SaaS) traps registry.
#
# Prefer is the norm. The one ask is revenue, because cash revenue and MRR
# differ enough in any month that the wrong one misstates growth.
version: 1

collisions:
  - phrase: [mrr, recurring revenue]
    candidates: [mrr, new_mrr, net_new_mrr, expansion_mrr, contraction_mrr, churned_mrr]
    policy: prefer mrr
    hint:
      mrr: "Active MRR as of each day. The board number."
      net_new_mrr: "MRR movement: new plus expansion, less contraction and churn."
  - phrase: [revenue, sales]
    candidates: [revenue, mrr]
    policy: ask
    why: "Cash revenue and MRR differ by a third in any given month and the board sees both; the wrong one misstates growth."
    hint:
      revenue: "Cash from succeeded payments, by payment date."
      mrr: "Active monthly recurring revenue as of each day."
  - phrase: [churn, cancellations]
    candidates: [churned_mrr, churned_subscriptions, customer_churn_rate]
    policy: prefer churned_mrr
    hint:
      churned_mrr: "MRR lost to cancellations."
      churned_subscriptions: "Count of cancelled subscriptions."
      customer_churn_rate: "Cancelled subscriptions as a share of active ones."
  - phrase: [active users, actives]
    candidates: [dau, wau, paying_active_users]
    policy: prefer dau
    hint:
      dau: "Daily active users."
      wau: "Weekly active users, trailing seven days."
      paying_active_users: "Active users on a paid plan."
  - phrase: [conversion, conversions]
    candidates: [trial_conversion_rate, visit_signup_rate, trial_conversions]
    policy: prefer trial_conversion_rate
    hint:
      trial_conversion_rate: "Share of trials that converted to paid."
      visit_signup_rate: "Signups per session."
      trial_conversions: "Count of trials that converted."

dimension_roles:
  - phrase: [plan, tier]
    candidates: [subscription_day__plan, mrr_movement__plan, trial__plan]
    policy: prefer subscription_day__plan
    disclose: "Plan is the subscriber's plan on each day, not the plan a trial or MRR movement was on."
  - phrase: [country, region, market]
    candidates: [user__country, trial__country, session__country]
    policy: prefer user__country
    disclose: "Country is the user's signup country."

conventions:
  - name: time_anchor
    value: latest_available_date
    disclose: true
  - name: default_window
    value: trailing_30_days
    policy: prefer

unanswerable:
  - phrase: [ltv, lifetime value, cac payback]
    reason: "No LTV or payback model yet. Ask about ARPU and churn rate instead."
  - phrase: [nps, net promoter]
    reason: "Survey data is not in the warehouse."
