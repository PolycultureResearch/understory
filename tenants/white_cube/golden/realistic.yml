  # -- over-refusal: answerable questions that look like a trap
  - id: net_new_mrr_explicit_2025_q1
    question: "What's our net new MRR for Q1 2025? Not total MRR, the movement."
    kind: over_refusal
    source: hand
    notes: >
      Names the non-preferred candidate and mentions the preferred one. The
      collision must leave net new MRR in place.
    spec:
      metrics: [net_new_mrr]
      time: {start: 2025-01-01, end: 2025-03-31}
    expected:
      status: resolved
      metrics: [net_new_mrr]
      numbers: [8606.17]

  - id: cash_revenue_ask_2025_03
    question: "Cash revenue collected in March 2025, not MRR"
    kind: over_refusal
    source: hand
    notes: >
      The person has said which one they mean, but 'revenue' is both the
      phrase and a candidate name, so the ask fires anyway. Recorded as the
      ask it is today; a first-turn miss the policy owes an answer for.
    spec:
      metrics: [revenue]
      time: {start: 2025-03-01, end: 2025-03-31}
    expected:
      status: needs_clarification
      clarification_traps: [collision:revenue]
      answers: {"collision:revenue": revenue}
      metrics: [revenue]
      disclosures: ["revenue"]
      numbers: [31128.0]

  - id: signups_by_country_2025
    question: "Which country signed up the most users in 2025?"
    kind: over_refusal
    source: hand
    spec:
      metrics: [signups]
      group_by: [user__country]
      time: {start: 2025-01-01, end: 2025-12-31}
    expected:
      status: resolved
      metrics: [signups]
      disclosures: ["signup country"]
      numbers: [1465.0, 951.0, 1840.0, 1221.0, 993.0, 8087.0, 1128.0, 929.0, 1697.0, 1499.0, 1978.0, 2454.0]

  - id: failed_payments_2026_q1
    question: "How many payments failed in Q1 2026?"
    kind: over_refusal
    source: hand
    spec:
      metrics: [failed_payments]
      time: {start: 2026-01-01, end: 2026-03-31}
    expected:
      status: resolved
      metrics: [failed_payments]
      numbers: [350.0]

  - id: trial_conversions_professional_2025_q3
    question: "How many trials converted to the professional plan in Q3 2025?"
    kind: over_refusal
    source: hand
    notes: >
      'plan' prefers the subscription day's plan, which a trial does not carry,
      so the prefer must stay on the trial's plan. A count, not the rate: a
      trial's plan is only set when it converts, so the rate filtered by plan
      is 1.0 by construction.
    spec:
      metrics: [trial_conversions]
      where:
        - {dimension: trial__plan, op: eq, values: [professional]}
      time: {start: 2025-07-01, end: 2025-09-30}
    expected:
      status: resolved
      metrics: [trial_conversions]
      disclosures: ["trial__plan"]
      numbers: [177.0]

  - id: expansion_mrr_by_month_2025
    question: "Expansion MRR by month for 2025"
    kind: over_refusal
    source: hand
    spec:
      metrics: [expansion_mrr]
      group_by: [metric_time]
      time: {grain: month, start: 2025-01-01, end: 2025-12-31}
    expected:
      status: resolved
      metrics: [expansion_mrr]
      numbers: [510.0, 243.67, 252.17, 362.67, 246.5, 736.67, 153.0, 742.33, 365.5, 640.33, 325.83, 345.67]

  - id: visit_signup_rate_mobile_2026_01_02
    question: "Visit-to-signup rate on mobile for January and February 2026"
    kind: over_refusal
    source: hand
    notes: >
      Filtered through the session's own device. Before fake_companies made
      the ratio single-model this came back as 1.0 when filtered through the
      user entity, and the realistic set carried a count instead.
    spec:
      metrics: [visit_signup_rate]
      group_by: [metric_time]
      where:
        - {dimension: session__device, op: eq, values: [mobile]}
      time: {grain: month, start: 2026-01-01, end: 2026-02-28}
    expected:
      status: resolved
      metrics: [visit_signup_rate]
      numbers: [0.0357, 0.0301]
